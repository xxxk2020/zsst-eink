name: Offline Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit and offline regressions
        run: |
          python3 tools/audit_public_source.py
          python3 tools/test_native_storage.py
          python3 tools/test_content_model.py
          python3 tools/test_eink_frame_gate.py
      - name: Build original example pack
        run: |
          python3 tools/make_resource_packs.py --source examples/source --out build/example-packs --single-pack
          python3 tools/validate_resource_pack.py build/example-packs/zsst-all-resources.zip
      - name: Build native APK
        working-directory: android
        run: bash gradlew --no-daemon --console=plain assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zsst-eink-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            build/example-packs/zsst-all-resources.zip
          if-no-files-found: error
          retention-days: 14
